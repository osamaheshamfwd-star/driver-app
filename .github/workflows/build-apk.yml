name: Build Flutter APK and AAB

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - run: flutter --version

      - name: Fix legacy wildcard params
        run: |
          grep -rlE "\(_, *_(, *_)*\)" lib | xargs -r sed -i -E 's/\(_, *_, *_\)/(_, __, ___)/g; s/\(_, *_\)/(_, __)/g'

      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Setup signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons
        timeout-minutes: 45

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB
        run: flutter build appbundle --release --android-skip-build-dependency-validation --no-tree-shake-icons
        timeout-minutes: 45

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab